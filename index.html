<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Magnetic Drawing Board</title>
<meta name="description" content="A magnetic drawing board toy: magnetic pen, star and heart stamps, and a slide eraser.">
<meta name="theme-color" content="#d9ecf2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MagBoard">
<style>
:root{
  --bg:#d9ecf2; --bg2:#c5e2ec; --ink:#2b4a57; --muted:#5d7e8b;
  --yellow:#f4d23e; --yellow-d:#dcb522; --yellow-dd:#c39c14;
  --blue:#4fa6cb; --blue-d:#3889ad; --blue-l:#8ccbe5;
  --surface:#e8eaea; --dot:#cfd3d4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#13232b;--bg2:#0e1b21;--ink:#cfe6ef;--muted:#86a7b4;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#13232b;--bg2:#0e1b21;--ink:#cfe6ef;--muted:#86a7b4;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(circle at 50% 35%,var(--bg) 0%,var(--bg2) 100%);
  color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
.toy{
  position:relative;container-type:inline-size;
  width:min(88vw,780px,calc((100% - 140px) * 1.3));
  aspect-ratio:1.3;
  margin-top:6%;
}
@supports (height:100svh){ .toy{width:min(86vw,780px,calc((100svh - 190px) * 1.3))} }
.handle{
  position:absolute;left:33%;width:34%;top:-7cqw;height:11cqw;
  border:3.4cqw solid var(--blue);border-bottom:none;border-radius:6cqw 6cqw 0 0;
  box-shadow:inset 0 .6cqw 0 rgba(255,255,255,.35);
}
.ear{position:absolute;width:20cqw;height:20cqw;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,var(--blue-l),var(--blue) 45%,var(--blue-d));}
.ear.tl{left:-3.5cqw;top:-3cqw}.ear.tr{right:-3.5cqw;top:-3cqw}
.ear.bl{left:-3.5cqw;bottom:-3cqw}.ear.br{right:-3.5cqw;bottom:-3cqw}
.body{
  position:absolute;inset:0;border-radius:8cqw / 10cqw;
  background:linear-gradient(170deg,#fbe36a,var(--yellow) 30%,var(--yellow-d));
  box-shadow:0 2.4cqw 4cqw rgba(20,60,80,.25), inset 0 -1.2cqw 0 var(--yellow-dd), inset 0 .8cqw 0 rgba(255,255,255,.4);
  display:grid;grid-template-columns:12cqw 1fr 10cqw;grid-template-rows:5.5cqw 1fr 9.5cqw;
}
.frame{
  grid-area:2/2;background:var(--blue);border-radius:3cqw;padding:2.6cqw;
  box-shadow:inset 0 .5cqw 0 rgba(255,255,255,.3), inset 0 -.6cqw 0 var(--blue-d);
}
.surface{
  position:relative;width:100%;height:100%;border-radius:1.2cqw;overflow:hidden;
  background:
    radial-gradient(circle,var(--dot) .9px,transparent 1.4px) 0 0/8px 7px,
    radial-gradient(circle,var(--dot) .9px,transparent 1.4px) 4px 3.5px/8px 7px,
    linear-gradient(180deg,#f2f3f3,var(--surface));
  box-shadow:inset 0 .8cqw 1.4cqw rgba(0,0,0,.18);
  cursor:crosshair;
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gh{pointer-events:none}
.left{grid-area:2/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw}
.undo,.save{height:52px;padding:0 22px 0 16px;border-radius:26px;display:inline-flex;align-items:center;gap:8px;flex:none;
  font-size:17px;font-weight:800;letter-spacing:.2px;color:#23627f;
  background:linear-gradient(170deg,#fbe36a,var(--yellow) 40%,var(--yellow-d));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 var(--yellow-dd),0 8px 16px rgba(20,60,80,.2);
  transition:transform .12s,opacity .2s,box-shadow .12s}
.undo svg,.save svg{width:26px;height:26px;flex:none}
.undo:active,.save:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 1px 0 var(--yellow-dd),0 4px 8px rgba(20,60,80,.18)}
.undo:focus-visible,.save:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:26px}
.undo[aria-disabled="true"]{opacity:.45;cursor:default}
.undo[aria-disabled="true"]:active{transform:none}
.socket{
  width:8.6cqw;height:8.6cqw;border-radius:50%;display:grid;place-items:center;
  background:var(--yellow-d);box-shadow:inset 0 .6cqw .8cqw rgba(0,0,0,.2);
}
button{all:unset;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:50%}
.stamp{width:7.4cqw;height:7.4cqw;display:grid;place-items:center;transition:transform .15s}
.stamp svg{width:100%;height:100%;filter:drop-shadow(0 .4cqw 0 var(--blue-d))}
.stamp.on{transform:translateY(-.8cqw) scale(1.08)}
.stamp.on svg{filter:drop-shadow(0 .4cqw 0 var(--blue-d)) drop-shadow(0 0 1.4cqw rgba(255,255,255,.95))}
.right{grid-area:2/3;display:flex;align-items:center;justify-content:center}
.groove{
  width:5cqw;height:62%;border-radius:3cqw;background:var(--yellow-d);
  box-shadow:inset 0 .6cqw .8cqw rgba(0,0,0,.2);display:flex;justify-content:center;position:relative;
}
.pen{position:absolute;top:-6%;height:112%;width:4cqw;display:flex;justify-content:center;transition:transform .2s}
.pen svg{height:100%;width:100%;overflow:visible}
.pen.on{transform:translate(-1.6cqw,-2cqw) rotate(-8deg)}
.bottom{grid-area:3/2;position:relative}
.track{position:absolute;left:0;right:0;top:1.6cqw;height:6.5cqw}
.rail{position:absolute;left:0;right:0;top:2.4cqw;height:1.6cqw;border-radius:1cqw;background:var(--yellow-dd);box-shadow:inset 0 .3cqw .5cqw rgba(0,0,0,.25)}
.knob{
  position:absolute;left:0;top:0;width:9cqw;height:6.5cqw;cursor:grab;touch-action:none;
  will-change:transform;
}
.knob svg{width:100%;height:100%;filter:drop-shadow(0 .5cqw 0 var(--blue-d))}
.knob:active{cursor:grabbing}
.overlay{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:5;opacity:0;transition:opacity .12s}
.overlay.show{opacity:1}
.pen.away{opacity:0}
.surface.nocursor{cursor:none}
.actions{display:flex;gap:16px;align-items:center;flex:none}
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;background:rgba(14,34,44,.38);
  padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);opacity:0;pointer-events:none;transition:opacity .18s}
.sheet.show{opacity:1;pointer-events:auto}
.sheet-card{width:min(440px,100%);background:#fff;color:#2b4a57;border-radius:22px;padding:18px 16px 12px;
  box-shadow:0 12px 40px rgba(14,34,44,.3);transform:translateY(14px);transition:transform .2s}
.sheet.show .sheet-card{transform:none}
.sheet-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border-radius:16px;background:#eef6f9;
  box-shadow:inset 0 0 0 2px #d3e7ef;font-size:15px;font-weight:600;text-align:center}
.opt:active{transform:scale(.97)}
.opt:focus-visible{outline:3px solid #4fa6cb;outline-offset:2px;border-radius:16px}
.opt img{width:100%;aspect-ratio:1.3;object-fit:contain;border-radius:10px;background:#dfeef4;display:block}
.sheet-x{display:block;width:100%;text-align:center;margin-top:10px;padding:12px 0;font-size:16px;color:#5d7e8b;border-radius:12px}
.sheet-x:focus-visible{outline:3px solid #4fa6cb}
.toast{z-index:60;
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translate(-50%,-10px);
  background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;white-space:nowrap;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="toy" id="toy">
  <div class="handle"></div>
  <div class="ear tl"></div><div class="ear tr"></div><div class="ear bl"></div><div class="ear br"></div>
  <div class="body">
    <div class="left">
      <div class="socket"><button class="stamp" id="star" aria-label="Star stamp">
        <svg viewBox="-12 -12 24 24"><path d="M0,-10 L2.6,-3.4 9.5,-3.1 4.1,1.3 5.9,8.1 0,4.3 -5.9,8.1 -4.1,1.3 -9.5,-3.1 -2.6,-3.4Z" fill="var(--blue)" stroke="var(--blue-l)" stroke-width="1" stroke-linejoin="round"/><circle cx="0" cy="0" r="2.6" fill="var(--blue-l)"/></svg>
      </button></div>
      <div class="socket"><button class="stamp" id="heart" aria-label="Heart stamp">
        <svg viewBox="-12 -12 24 24"><path d="M0,9 C-6,4 -10,0.5 -10,-3.5 C-10,-7 -7.2,-9 -4.8,-9 C-2.6,-9 -1,-7.6 0,-5.8 C1,-7.6 2.6,-9 4.8,-9 C7.2,-9 10,-7 10,-3.5 C10,0.5 6,4 0,9Z" fill="var(--blue)" stroke="var(--blue-l)" stroke-width="1" stroke-linejoin="round"/><circle cx="0" cy="-2" r="2.6" fill="var(--blue-l)"/></svg>
      </button></div>
    </div>
    <div class="frame"><div class="surface" id="surface"><canvas id="cv"></canvas><canvas id="gh" aria-hidden="true"></canvas></div></div>
    <div class="right">
      <div class="groove"><button class="pen on" id="pen" aria-label="Magnetic pen, tap again to change size">
        <svg viewBox="0 0 10 100" preserveAspectRatio="none">
          <rect x="2" y="2" width="6" height="80" rx="3" fill="var(--blue)"/>
          <rect x="3.2" y="6" width="1.4" height="60" rx=".7" fill="var(--blue-l)"/>
          <path d="M2,80 L8,80 L5,98Z" fill="var(--blue-d)"/>
        </svg>
      </button></div>
    </div>
    <div class="bottom">
      <div class="track" id="track">
        <div class="rail"></div>
        <div class="knob" id="knob" role="slider" aria-label="Eraser slider" tabindex="0">
          <svg viewBox="0 0 36 26"><path d="M18,25 C8,25 4,20 6,15 C7,12 4,10 5,6 C6,2 10,2 12,4 C13,1 16,0 18,0 C20,0 23,1 24,4 C26,2 30,2 31,6 C32,10 29,12 30,15 C32,20 28,25 18,25Z" fill="var(--blue)"/><ellipse cx="18" cy="14" rx="7" ry="5" fill="var(--blue-l)"/></svg>
        </div>
      </div>
    </div>
  </div>
<svg class="overlay" id="ov" aria-hidden="true">
    <path id="cord" fill="none" stroke="var(--blue-d)" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse id="shade" fill="#0d2a36"/>
    <g id="stylus">
      <path id="sTip" fill="var(--blue-d)"/>
      <rect id="sBody" fill="var(--blue)"/>
      <rect id="sHi" fill="var(--blue-l)"/>
      <circle id="sDot" fill="#3d4a50"/>
    </g>
  </svg>
</div>

<div class="actions">
<button class="undo" id="undo" aria-disabled="true">
  <svg viewBox="0 0 24 24"><path d="M8.5 5.5 4.5 9.5l4 4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5h9.5a5 5 0 0 1 0 10H10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Undo</span>
</button>
<button class="save" id="save">
  <svg viewBox="0 0 24 24"><path d="M12 4v10m-4.2-4.2L12 14l4.2-4.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15.5v2a2.5 2.5 0 0 0 2.5 2.5h9a2.5 2.5 0 0 0 2.5-2.5v-2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Save</span>
</button>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Save image">
    <div class="sheet-title">Save image</div>
    <div class="opts">
      <button class="opt" data-k="board"><img id="pvBoard" alt=""><span>With board</span></button>
      <button class="opt" data-k="surface"><img id="pvSurf" alt=""><span>Drawing only</span></button>
    </div>
    <button class="sheet-x" id="sheetX">Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(()=>{
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const gh=document.getElementById('gh'), gx=gh.getContext('2d');
const toastEl=document.getElementById('toast');
let dpr=1,W=0,H=0;
const KEY='magnetic-board-v1';

function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),1100);}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

function fit(){
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  const old=document.createElement('canvas'); old.width=cv.width; old.height=cv.height;
  if(cv.width&&cv.height) old.getContext('2d').drawImage(cv,0,0);
  dpr=window.devicePixelRatio||1; W=r.width; H=r.height;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  gh.width=cv.width; gh.height=cv.height; gx.setTransform(dpr,0,0,dpr,0,0);
  ctx.setTransform(1,0,0,1,0,0);
  if(old.width&&old.height) ctx.drawImage(old,0,0,cv.width,cv.height);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

// magnetic particles
const palette=[];
for(let i=0;i<10;i++){const g=34+Math.random()*26|0;palette.push(`rgba(${g},${g+3},${g+8},${(0.55+Math.random()*0.4).toFixed(2)})`);}
function dab(x,y,r,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.2832, d=r*Math.sqrt(Math.random()), s=0.9+Math.random()*1.1;
    ctx.fillStyle=palette[Math.random()*10|0];
    ctx.fillRect(x+Math.cos(a)*d-s/2,y+Math.sin(a)*d-s/2,s,s);
  }
}

const sizes=[{r:1.6,n:4,l:'Regular'},{r:2.8,n:8,l:'Medium'},{r:5,n:18,l:'Bold'}];
let sz=1, tool='pen';

// stamps
function starPoly(cx,cy,R){const p=[];for(let i=0;i<10;i++){const rr=i%2?R*.44:R,a=-Math.PI/2+i*Math.PI/5;p.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}return p;}
function heartPoly(cx,cy,R){const p=[];for(let i=0;i<72;i++){const t=i/72*6.2832;const x=16*Math.pow(Math.sin(t),3);const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));p.push([cx+x*R/17,cy+(y+2)*R/17]);}return p;}
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
function rot(p,cx,cy,a){if(!a)return p;const c=Math.cos(a),s=Math.sin(a);return p.map(([x,y])=>[cx+(x-cx)*c-(y-cy)*s,cy+(x-cx)*s+(y-cy)*c]);}
const stampR=()=>Math.max(20,Math.min(W,H)*.1);
function stampPoly(kind,cx,cy,a){const R=stampR();return rot(kind==='star'?starPoly(cx,cy,R):heartPoly(cx,cy,R),cx,cy,a);}
function stamp(kind,cx,cy,ang=0){
  const R=Math.max(20,Math.min(W,H)*.1);
  const p=stampPoly(kind,cx,cy,ang);
  const N=(R*R*2.6)|0;
  for(let k=0;k<N;k++){const x=cx-R*1.1+Math.random()*R*2.2,y=cy-R*1.1+Math.random()*R*2.2;if(inPoly(x,y,p))dab(x,y,.5,1);}
  for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];const L=Math.hypot(b[0]-a[0],b[1]-a[1]),s=Math.max(1,Math.ceil(L/1.4));for(let k=0;k<s;k++)dab(a[0]+(b[0]-a[0])*k/s,a[1]+(b[1]-a[1])*k/s,1.4,3);}
  buzz(18);
  tone(170,55,.14,.55); burst(3000,.18,.25); tone(2600,1800,.02,.08,'square');
}

// drawing
let drawing=false,last=null;
function pos(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function line(a,b){const s=sizes[sz];const L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(L/1.1));for(let k=1;k<=n;k++)dab(a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n,s.r,s.n);}
// sound (Web Audio, synthesized) — always on by design
let AC=null,noiseBuf=null,penG=null,penF=null,eraG=null,eraF=null,muted=false,penShown=false;
let penIdle,eraIdle,lastPT=0,lastET=0;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const len=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(Math.random()<.3?1:.25);
  const mk=(f,q)=>{const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=0;s.connect(fl).connect(g).connect(AC.destination);s.start();return [g,fl];};
  [penG,penF]=mk(2600,.9);
  [eraG,eraF]=mk(700,.5);eraF.type='lowpass';
}
document.addEventListener('pointerdown',audioInit,true);
document.addEventListener('keydown',audioInit,true);
// iOS standalone PWAs suspend audio when backgrounded; resume on return
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state!=='running')AC.resume().catch(()=>{});});
function level(g,v){if(AC&&g)g.gain.setTargetAtTime(muted?0:v,AC.currentTime,.03);}
function tone(f1,f2,dur,vol,type='sine'){
  if(!AC||muted)return; const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
function burst(f,dur,vol){
  if(!AC||muted)return; const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;fl.type='bandpass';fl.frequency.value=f;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(fl).connect(g).connect(AC.destination);s.start(t,Math.random());s.stop(t+dur+.02);
}
function penSound(dist,t){
  if(!AC)return; const dt=Math.max(4,t-lastPT);lastPT=t; const sp=dist/dt;
  penF.frequency.setTargetAtTime(1800+Math.min(3000,sp*1400),AC.currentTime,.03);
  level(penG,Math.min(.5,sp*.28)*(.7+sz*.2));
  clearTimeout(penIdle);penIdle=setTimeout(()=>level(penG,0),70);
}
function eraSound(d){
  if(!AC)return; const t=performance.now(),dt=Math.max(8,t-lastET);lastET=t; const sp=d/dt;
  eraF.frequency.setTargetAtTime(400+Math.min(900,sp*300),AC.currentTime,.04);
  level(eraG,Math.min(.9,sp*.5));
  clearTimeout(eraIdle);eraIdle=setTimeout(()=>level(eraG,0),90);
}

// simulated stylus
const toyEl=document.getElementById('toy'),ov=document.getElementById('ov'),grooveEl=document.querySelector('.groove'),surfEl=document.getElementById('surface');
const $=id=>document.getElementById(id);
const stylus=$('stylus'),cord=$('cord'),shade=$('shade'),sTip=$('sTip'),sBody=$('sBody'),sHi=$('sHi'),sDot=$('sDot');
let hovering=false,penXY=null;
function penVis(){
  const show=tool==='pen'&&penXY&&(drawing||hovering);
  if(!!show!==penShown){penShown=!!show;if(show)tone(1500,800,.05,.14,'triangle');else tone(800,450,.06,.14,'triangle');}
  ov.classList.toggle('show',!!show);
  document.getElementById('pen').classList.toggle('away',!!show);
  surfEl.classList.toggle('nocursor',tool==='pen');
}
function setA(el,o){for(const k in o)el.setAttribute(k,o[k]);}
function drawPen(){
  if(!penXY) return;
  const tr=toyEl.getBoundingClientRect(),cr=cv.getBoundingClientRect(),gr=grooveEl.getBoundingClientRect();
  const lift=drawing?0:8;
  const px=penXY[0]+cr.left-tr.left,py=penXY[1]+cr.top-tr.top;
  const x=px+lift*.5,y=py-lift;
  const L=tr.width*.24,w=Math.max(7,tr.width*.03),ang=28,a=ang*Math.PI/180;
  const tipH=L*.14;
  setA(sTip,{d:`M${-w/2} ${-tipH} L${w/2} ${-tipH} L0 0Z`});
  setA(sBody,{x:-w/2,y:-L,width:w,height:L-tipH+.5,rx:w/2});
  setA(sHi,{x:-w/2+w*.18,y:-L+w*.7,width:w*.22,height:L*.6,rx:w*.11});
  setA(sDot,{cx:0,cy:-w*.15,r:w*.16});
  stylus.setAttribute('transform',`translate(${x} ${y}) rotate(${ang})`);
  setA(shade,{cx:px+lift*.4,cy:py+lift*.2,rx:w*(drawing?.7:1),ry:w*(drawing?.28:.4),opacity:drawing?.32:.15});
  const ex=x+L*Math.sin(a),ey=y-L*Math.cos(a);
  const ax=gr.left-tr.left+gr.width/2,ay=gr.top-tr.top+gr.height*.12;
  const cx=(ax+ex)/2,cy=Math.max(ay,ey)+tr.width*.07;
  cord.setAttribute('d',`M${ex} ${ey} Q${cx} ${cy} ${ax} ${ay}`);
}
cv.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&tool==='pen'){hovering=true;penXY=pos(e);drawPen();penVis();}});
cv.addEventListener('pointerleave',()=>{hovering=false;if(!drawing)penVis();});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); const p=pos(e);
  if(tool!=='pen'){cv.setPointerCapture(e.pointerId);stS={cx:p[0],cy:p[1],ang:0,step:0};ghost();return;}
  snap(); cv.setPointerCapture(e.pointerId); drawing=true; last=p; penXY=p; drawPen(); penVis();
  dab(p[0],p[1],sizes[sz].r,sizes[sz].n*2);
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse') hovering=true;
  if(stS){
    const p=pos(e),dx=p[0]-stS.cx,dy=p[1]-stS.cy;
    if(Math.hypot(dx,dy)>14){
      stS.ang=Math.atan2(dy,dx)+Math.PI/2;
      const st=Math.round(stS.ang/(Math.PI/12));
      if(st!==stS.step){stS.step=st;tone(1900,1600,.015,.05,'triangle');}
      ghost();
    }
    return;
  }
  if(drawing){
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    let dist=0;
    for(const ev of evs){const p=pos(ev);dist+=Math.hypot(p[0]-last[0],p[1]-last[1]);line(last,p);last=p;}
    penSound(dist,e.timeStamp);
  }
  if(tool==='pen'){penXY=pos(e);drawPen();penVis();}
});
function end(e){
  if(drawing){drawing=false;save();level(penG,0);}
  if(e&&e.pointerType!=='mouse') hovering=false;
  drawPen(); penVis();
}
cv.addEventListener('pointerup',e=>{if(stS){const s0=stS;stS=null;ghost();snap();stamp(tool,s0.cx,s0.cy,s0.ang);save();return;}end(e);});
cv.addEventListener('pointercancel',e=>{if(stS){stS=null;ghost();return;}end(e);});
// stamp preview: dashed outline + rotation guide
let stS=null;
function ghost(){
  gx.clearRect(0,0,W,H); if(!stS) return;
  const p=stampPoly(tool,stS.cx,stS.cy,stS.ang),R=stampR();
  gx.save();gx.lineWidth=2;gx.setLineDash([4,4]);gx.strokeStyle='rgba(56,137,173,.9)';gx.fillStyle='rgba(79,166,203,.12)';
  gx.beginPath();p.forEach(([x,y],i)=>i?gx.lineTo(x,y):gx.moveTo(x,y));gx.closePath();gx.fill();gx.stroke();
  // rotate symbol: two clockwise arcs with arrowheads circling the stamp, turning with it
  const rr=R*1.38,base=stS.ang-Math.PI/2,ah=Math.max(6,R*.2);
  gx.setLineDash([]);gx.lineWidth=2.6;gx.lineCap='round';gx.strokeStyle=gx.fillStyle='rgba(56,137,173,.95)';
  for(const off of [0,Math.PI]){
    const a0=base+off+.38,a1=base+off+Math.PI-.62;
    gx.beginPath();gx.arc(stS.cx,stS.cy,rr,a0,a1);gx.stroke();
    const ex=stS.cx+Math.cos(a1)*rr,ey=stS.cy+Math.sin(a1)*rr,tx=-Math.sin(a1),ty=Math.cos(a1),nx=Math.cos(a1),ny=Math.sin(a1);
    gx.beginPath();gx.moveTo(ex+tx*ah,ey+ty*ah);gx.lineTo(ex+nx*ah*.6,ey+ny*ah*.6);gx.lineTo(ex-nx*ah*.6,ey-ny*ah*.6);gx.closePath();gx.fill();
  }
  gx.restore();
}

// tools
const btn={pen:document.getElementById('pen'),star:document.getElementById('star'),heart:document.getElementById('heart')};
function setTool(t){tool=t;for(const k in btn)btn[k].classList.toggle('on',k===t);penVis();tone(650,420,.05,.16,'triangle');}
btn.pen.addEventListener('click',()=>{if(tool==='pen'){sz=(sz+1)%3;toast(sizes[sz].l);tone(900+sz*300,700+sz*200,.04,.15,'triangle');}else{setTool('pen');toast(sizes[sz].l);}});
btn.star.addEventListener('click',()=>{setTool(tool==='star'?'pen':'star');if(tool==='star')toast('Tap to stamp · drag to rotate');});
btn.heart.addEventListener('click',()=>{setTool(tool==='heart'?'pen':'heart');if(tool==='heart')toast('Tap to stamp · drag to rotate');});

// eraser slider
const track=document.getElementById('track'),knob=document.getElementById('knob');
let kx=0,B=12,anim=null;
const maxK=()=>Math.max(1,track.clientWidth-knob.offsetWidth);
const toSurf=k=>(k/maxK())*(W+2*B)-B;
function setKnob(nx,doWipe=true){
  nx=Math.max(0,Math.min(maxK(),nx));
  const prev=kx;
  const a=toSurf(kx),b=toSurf(nx); kx=nx;
  if(doWipe&&prev!==nx&&(nx===0||nx===maxK())){tone(150,70,.1,.4);burst(1200,.05,.15);buzz(12);}
  knob.style.transform=`translateX(${kx}px)`;
  if(doWipe&&a!==b){ctx.clearRect(Math.min(a,b)-B,0,Math.abs(b-a)+2*B,H);eraSound(Math.abs(b-a));}
}
let dragOff=null,moved=false;
knob.addEventListener('pointerdown',e=>{e.preventDefault();cancelAnimationFrame(anim);knob.setPointerCapture(e.pointerId);dragOff=e.clientX-kx;moved=false;});
knob.addEventListener('pointermove',e=>{if(dragOff===null)return;const nx=e.clientX-dragOff;if(Math.abs(nx-kx)>.5){if(!moved)snap();moved=true;setKnob(nx);if(Math.random()<.15)buzz(4);}});
function drop(){if(dragOff!==null){dragOff=null;if(moved)save();}}
knob.addEventListener('pointerup',drop);knob.addEventListener('pointercancel',drop);
function sweep(){
  cancelAnimationFrame(anim); snap();
  const from=kx,to=kx>maxK()/2?0:maxK(),t0=performance.now(),dur=550;
  const step=t=>{const f=Math.min(1,(t-t0)/dur),ease=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;setKnob(from+(to-from)*ease);if(f<1)anim=requestAnimationFrame(step);else{ctx.clearRect(0,0,W,H);save();}};
  anim=requestAnimationFrame(step); buzz(30);
}
knob.addEventListener('dblclick',sweep);
let lastTap=0;
knob.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')return;const n=performance.now();if(!moved&&n-lastTap<320){sweep();lastTap=0;}else if(!moved)lastTap=n;});
knob.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){snap();setKnob(kx+maxK()/12);save();e.preventDefault();}
  else if(e.key==='ArrowLeft'){snap();setKnob(kx-maxK()/12);save();e.preventDefault();}
  else if(e.key==='Enter'||e.key===' '){sweep();e.preventDefault();}
});

// undo history (canvas snapshots, newest last)
const undoBtn=document.getElementById('undo'),hist=[],MAXH=15;
function syncUndo(){undoBtn.setAttribute('aria-disabled',hist.length?'false':'true');}
function snap(){
  if(!cv.width||!cv.height) return;
  const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;
  c.getContext('2d').drawImage(cv,0,0);
  hist.push(c); if(hist.length>MAXH) hist.shift(); syncUndo();
}
function undo(){
  if(!hist.length){buzz(8);return;}
  const c=hist.pop();
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(c,0,0,cv.width,cv.height);ctx.restore();
  save(); syncUndo(); buzz(12); tone(520,760,.06,.16,'triangle');
}
undoBtn.addEventListener('click',undo);
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}});

// ===== save as image =====
const rootCS=getComputedStyle(document.documentElement);
const cssv=n=>rootCS.getPropertyValue('--'+n).trim();
const C={blue:cssv('blue'),bd:cssv('blue-d'),bl:cssv('blue-l'),y:cssv('yellow'),yd:cssv('yellow-d'),ydd:cssv('yellow-dd'),dot:cssv('dot')};
// rasterize the toy's inline SVG icons once, so saving stays inside the tap (needed for iOS share)
function rast(el,w,h){
  const c=el.cloneNode(true);c.setAttribute('width',w);c.setAttribute('height',h);c.removeAttribute('class');
  const str=new XMLSerializer().serializeToString(c).replace(/var\(--([\w-]+)\)/g,(_,n)=>cssv(n));
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str);return img;
}
const IMG={star:rast(document.querySelector('#star svg'),256,256),heart:rast(document.querySelector('#heart svg'),256,256),
  pen:rast(document.querySelector('#pen svg'),80,800),knob:rast(document.querySelector('#knob svg'),360,260)};
const ready=i=>i.complete&&i.naturalWidth>0;

function erect(g,x,y,w,h,rx,ry=rx){ // rounded rect with elliptical corners
  rx=Math.min(rx,w/2);ry=Math.min(ry,h/2);
  g.beginPath();g.moveTo(x+rx,y);g.lineTo(x+w-rx,y);g.ellipse(x+w-rx,y+ry,rx,ry,0,-Math.PI/2,0);
  g.lineTo(x+w,y+h-ry);g.ellipse(x+w-rx,y+h-ry,rx,ry,0,0,Math.PI/2);
  g.lineTo(x+rx,y+h);g.ellipse(x+rx,y+h-ry,rx,ry,0,Math.PI/2,Math.PI);
  g.lineTo(x,y+ry);g.ellipse(x+rx,y+ry,rx,ry,0,Math.PI,Math.PI*1.5);g.closePath();
}
function paintSurface(g,x,y,w,h,k,r){
  g.save();erect(g,x,y,w,h,r);g.clip();
  const lg=g.createLinearGradient(0,y,0,y+h);lg.addColorStop(0,'#f2f3f3');lg.addColorStop(1,'#e8eaea');g.fillStyle=lg;g.fillRect(x,y,w,h);
  g.fillStyle=C.dot;
  for(const [ox,oy] of [[0,0],[4,3.5]]) for(let yy=oy;yy<h/k+7;yy+=7) for(let xx=ox;xx<w/k+8;xx+=8){g.beginPath();g.arc(x+xx*k,y+yy*k,1.05*k,0,6.2832);g.fill();}
  g.drawImage(cv,x,y,w,h);
  if(r){const sg=g.createLinearGradient(0,y,0,y+h*.06);sg.addColorStop(0,'rgba(0,0,0,.14)');sg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=sg;g.fillRect(x,y,w,h*.06);}
  g.restore();
}
function exportSurface(){
  const sc=Math.max(1,1500/cv.width),c=document.createElement('canvas');c.width=Math.round(cv.width*sc);c.height=Math.round(cv.height*sc);
  const g=c.getContext('2d');g.imageSmoothingQuality='high';paintSurface(g,0,0,c.width,c.height,dpr*sc,0);return c;
}
function exportBoard(){
  const t=toyEl.getBoundingClientRect(),q=t.width/100,m=12*q,k=Math.max(2,dpr,1800/(t.width+2*m));
  const c=document.createElement('canvas');c.width=Math.round((t.width+2*m)*k);c.height=Math.round((t.height+2*m)*k);
  const g=c.getContext('2d');g.imageSmoothingQuality='high';
  const bg=g.createRadialGradient(c.width/2,c.height*.35,0,c.width/2,c.height*.35,Math.hypot(c.width,c.height)*.6);
  bg.addColorStop(0,cssv('bg'));bg.addColorStop(1,cssv('bg2'));g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);
  g.scale(k,k);g.translate(m,m);
  const R=sel=>{const r=(typeof sel==='string'?document.querySelector(sel):sel).getBoundingClientRect();return {x:r.left-t.left,y:r.top-t.top,w:r.width,h:r.height};};
  // handle
  g.save();g.strokeStyle=C.blue;g.lineWidth=3.4*q;g.lineCap='butt';
  const hx=33*t.width/100+1.7*q,hw=34*t.width/100-3.4*q,hy=-7*q+1.7*q,hb=4*q,hr=4.3*q;
  g.beginPath();g.moveTo(hx,hb);g.lineTo(hx,hy+hr);g.arcTo(hx,hy,hx+hr,hy,hr);g.lineTo(hx+hw-hr,hy);g.arcTo(hx+hw,hy,hx+hw,hy+hr,hr);g.lineTo(hx+hw,hb);g.stroke();g.restore();
  // ears
  document.querySelectorAll('.ear').forEach(e=>{const r=R(e),cx=r.x+r.w/2,cy=r.y+r.h/2,rad=r.w/2;
    const eg=g.createRadialGradient(r.x+r.w*.38,r.y+r.h*.32,0,r.x+r.w*.38,r.y+r.h*.32,rad*1.25);
    eg.addColorStop(0,C.bl);eg.addColorStop(.45,C.blue);eg.addColorStop(1,C.bd);g.fillStyle=eg;g.beginPath();g.arc(cx,cy,rad,0,6.2832);g.fill();});
  // body
  const bw=t.width,bh=t.height;
  g.save();g.shadowColor='rgba(20,60,80,.25)';g.shadowBlur=4*q;g.shadowOffsetY=2.4*q;erect(g,0,0,bw,bh,8*q,10*q);g.fillStyle=C.ydd;g.fill();g.restore();
  g.save();erect(g,0,0,bw,bh,8*q,10*q);g.clip();
  const yg=g.createLinearGradient(0,0,bw*.17,bh);yg.addColorStop(0,'#fbe36a');yg.addColorStop(.3,C.y);yg.addColorStop(1,C.yd);
  g.fillStyle=yg;erect(g,0,-1.2*q,bw,bh,8*q,10*q);g.fill();
  g.fillStyle='rgba(255,255,255,.4)';g.fillRect(0,0,bw,.8*q);g.restore();
  // frame + surface
  const fr=R('.frame');g.fillStyle=C.bd;erect(g,fr.x,fr.y,fr.w,fr.h,3*q);g.fill();g.fillStyle=C.blue;erect(g,fr.x,fr.y,fr.w,fr.h-.6*q,3*q);g.fill();
  const sr=R('#surface');paintSurface(g,sr.x,sr.y,sr.w,sr.h,1,1.2*q);
  // sockets + stamp icons
  document.querySelectorAll('.socket').forEach((s,i)=>{const r=R(s);g.fillStyle=C.yd;g.beginPath();g.arc(r.x+r.w/2,r.y+r.h/2,r.w/2,0,6.2832);g.fill();
    const im=i?IMG.heart:IMG.star,sz=7.4*q;if(ready(im)){g.save();g.shadowColor=C.bd;g.shadowOffsetY=.4*q;g.drawImage(im,r.x+(r.w-sz)/2,r.y+(r.h-sz)/2,sz,sz);g.restore();}});
  // groove + pen
  const gr=R('.groove');g.fillStyle=C.yd;erect(g,gr.x,gr.y,gr.w,gr.h,Math.min(3*q,gr.w/2));g.fill();
  if(ready(IMG.pen)){const pw=4*q;g.drawImage(IMG.pen,gr.x+(gr.w-pw)/2,gr.y-gr.h*.06,pw,gr.h*1.12);}
  // eraser rail + knob
  const rl=R('.rail');g.fillStyle=C.ydd;erect(g,rl.x,rl.y,rl.w,rl.h,1*q);g.fill();
  const kn=R('#knob');if(ready(IMG.knob)){g.save();g.shadowColor=C.bd;g.shadowOffsetY=.5*q;g.drawImage(IMG.knob,kn.x,kn.y,kn.w,kn.h);g.restore();}
  return c;
}
function dataToFile(url,name){const b=atob(url.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new File([u],name,{type:'image/png'});}
function stampName(kind){const d=new Date(),p=n=>String(n).padStart(2,'0');return `magboard-${kind}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Saved');}
// inside the claude.ai viewer, files are handed over through its downloads capability
let DL=null;try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{DL=d;}).catch(()=>{});}catch(e){}
const sheet=document.getElementById('sheet');let built={};
function openSheet(){
  built={board:exportBoard(),surface:exportSurface()};
  const thumb=(src)=>{const w=360,h=Math.round(w*src.height/src.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(src,0,0,w,h);return c.toDataURL('image/png');};
  document.getElementById('pvBoard').src=thumb(built.board);document.getElementById('pvSurf').src=thumb(built.surface);
  sheet.classList.add('show');sheet.setAttribute('aria-hidden','false');tone(700,980,.05,.14,'triangle');
  setTimeout(()=>sheet.querySelector('.opt').focus(),50);
}
function closeSheet(){sheet.classList.remove('show');sheet.setAttribute('aria-hidden','true');built={};}
function saveKind(kind){
  const c=built[kind]; if(!c) return; const url=c.toDataURL('image/png'),name=stampName(kind==='board'?'board':'drawing');
  closeSheet(); buzz(15);
  if(DL&&file){DL.save({filename:name,data:file}).then(()=>toast('Saved')).catch(err=>{if(!err||err.code!=='declined')toast('Could not save here');});return;}
  const coarse=matchMedia('(pointer:coarse)').matches;
  let file=null;try{file=dataToFile(url,name);}catch(e){}
  if(coarse&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(()=>toast('Saved')).catch(err=>{if(err&&err.name!=='AbortError')download(url,name);});
  } else download(url,name);
}
document.getElementById('save').addEventListener('click',openSheet);
document.getElementById('sheetX').addEventListener('click',closeSheet);
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet();});
sheet.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>saveKind(b.dataset.k)));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('show'))closeSheet();});

// persistence (per-device)
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,cv.toDataURL('image/png'));}catch(e){}},250);}
function load(){
  let d=null;try{d=localStorage.getItem(KEY);}catch(e){}
  if(!d) return;
  const img=new Image();img.onload=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(img,0,0,cv.width,cv.height);ctx.restore();};img.src=d;
}

new ResizeObserver(()=>{const f=kx/maxK();fit();setKnob(f*maxK(),false);}).observe(cv);
fit(); load();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
})();

// PWA: offline support + installable
if('serviceWorker' in navigator){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
